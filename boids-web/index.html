<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boids in the Blue (Web Port)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="ocean"></canvas>

<!-- Generated from core/boids-core.js by tools/build.js (npm run build): do not edit -->
<script src="boids-core.js"></script>
<script>
    // --- BOIDS IN THE BLUE (WEB PORT) ---
    // The simulation is the shared core (window.BoidsCore); this page only owns
    // the canvas renderer, the day/night background and mouse input.

    const Core = window.BoidsCore;

    // --- SETTINGS (passed to the core; same keys as the KDE plugin settings) ---
    const CONFIG = {
        fishCount: 38,
        jellyCount: 5,
        anglerCount: 3,
        orcaCount: 3
        // fishSize, orcaSize, cursorFearLevel, fishMaxSpeed ... are also accepted
    };

    const TICK_MS = 40;          // fixed 25 Hz simulation step, same as the KDE plugin
    const MAX_CATCHUP_TICKS = 5; // never simulate more than this many ticks per frame

    // --- DAY/NIGHT ---
    function getDayNightColors(h) {
        const b = (Math.cos((h - 12) * Math.PI / 12) + 1) / 2;
        const r1 = Math.round(13 + (26 - 13) * b), g1 = Math.round(26 + (122 - 26) * b), b1 = Math.round(64 + (176 - 64) * b);
        const r2 = Math.round(5 + (13 - 5) * b), g2 = Math.round(10 + (85 - 10) * b), b2 = Math.round(31 + (128 - 31) * b);
        return { top: 'rgb(' + r1 + ',' + g1 + ',' + b1 + ')', bottom: 'rgb(' + r2 + ',' + g2 + ',' + b2 + ')' };
    }
    let waterTop = 'rgb(13, 26, 64)', waterBottom = 'rgb(5, 10, 31)', lastDn = -Infinity;
    function updateDayNight(now) {
        if (now - lastDn < 3000) return;
        lastDn = now;
        const d = new Date();
        const dn = getDayNightColors(d.getHours() + d.getMinutes() / 60);
        waterTop = dn.top; waterBottom = dn.bottom;
    }

    // --- CANVAS / SIM ---
    const canvas = document.getElementById('ocean');
    const ctx = canvas.getContext('2d', { alpha: false });
    let width = 0, height = 0, dpr = 1;
    let sim = null;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;
        if (sim) Core.resize(sim, width, height, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    sim = Core.createSimulation(width, height, dpr, CONFIG);
    Core.step(sim, 1, CONFIG); // fills sim._c (sizes) before the first draw

    // --- RENDERING (same layer colours as the KDE BoidDelegate) ---
    const SPR = Core.SPRITES;
    const BODY = { orca: '#4D6680', angler: '#403359', jelly: '#8B7BB5' };

    function drawSprite(sprite, x, y, size, flip, body, layer2, layer3, alpha) {
        if (!(size > 0)) return;
        const rows = sprite.length, cols = sprite[0].length;
        const w = size + 1, h = size + 1;
        const left = x + 0.5 - cols * size / 2;
        const top = y + 0.5 - rows * size / 2;
        ctx.globalAlpha = alpha;
        for (let layer = 1; layer <= 3; layer++) {
            const col = layer === 1 ? body : layer === 2 ? layer2 : layer3;
            if (!col) continue;
            ctx.beginPath();
            let has = false;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (sprite[r][c] !== layer) continue;
                    ctx.rect(left + (flip ? cols - 1 - c : c) * size, top + r * size, w, h);
                    has = true;
                }
            }
            if (has) { ctx.fillStyle = col; ctx.fill(); }
        }
        ctx.globalAlpha = 1;
    }

    function drawEntity(ent) {
        if (!isFinite(ent.x) || !isFinite(ent.y)) return;
        if (ent.x < -60 || ent.x > width + 60 || ent.y < -60 || ent.y > height + 60) return;
        const cc = sim._c;
        const flip = !ent.facingRight;
        switch (ent.kind) {
        case 'fish':
            drawSprite(SPR.FISH, ent.x, ent.y, cc.fishSize + ent.sizeVariation, flip, ent.color || '#FFFFFF', '#FFFFFF', null, 1);
            break;
        case 'angler':
            drawSprite(SPR.ANGLER, ent.x, ent.y, cc.anglerSize, flip, BODY.angler, '#FFFF99', '#FF3333', 1);
            break;
        case 'orca':
            drawSprite(SPR.ORCA, ent.x, ent.y, cc.orcaSize, flip, BODY.orca, '#E6E6E6', null, 1);
            break;
        case 'jelly':
            drawSprite(SPR.JELLY, ent.x, ent.y, cc.jellySize + ent.sizeVariation, false, BODY.jelly, BODY.jelly, null, 0.25);
            break;
        case 'worm':
            drawSprite(SPR.WORM, ent.x, ent.y, cc.wormSize, false, Core.WORM_COLOR, null, null, Math.max(0, Math.min(1, ent.life)));
            break;
        case 'bubble':
            drawSprite(SPR.BUBBLE, ent.x, ent.y, ent.scale, false, Core.BUBBLE_COLOR, null, null, 1);
            break;
        }
    }

    const reported = {};
    function reportOnce(where, e) {
        const key = where + ': ' + (e && e.message ? e.message : e);
        if (reported[key]) return;
        reported[key] = true;
        console.error('[boids] ' + key);
    }

    function render() {
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, waterTop); grad.addColorStop(1, waterBottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
        // allLists order = worms, bubbles, fish, anglers, orcas, jellies (as in KDE)
        for (const list of sim.allLists) {
            for (let i = 0; i < list.length; i++) {
                try { drawEntity(list[i]); } catch (e) { reportOnce('draw', e); }
            }
        }
    }

    // --- MAIN LOOP: fixed-step accumulator driven by requestAnimationFrame ---
    let lastTime = 0, accumulator = 0;

    function animate(now) {
        requestAnimationFrame(animate);
        const frame = lastTime ? now - lastTime : 0;
        lastTime = now;
        accumulator = Math.min(accumulator + frame, TICK_MS * MAX_CATCHUP_TICKS);
        while (accumulator >= TICK_MS) {
            try { Core.step(sim, 1, CONFIG); } catch (e) { reportOnce('step', e); }
            accumulator -= TICK_MS;
        }
        updateDayNight(now);
        render();
    }
    requestAnimationFrame(animate);

    // --- INPUT (mapped to sim.mouse like the KDE plugin) ---
    function jitter(n) { return (Math.random() - 0.5) * n; }
    let moveCount = 0, pressed = false, isDrag = false, dragMoves = 0;

    canvas.addEventListener('mousemove', e => {
        sim.mouse.x = e.clientX; sim.mouse.y = e.clientY;
        moveCount = (moveCount + 1) % 1000000;
        if (moveCount % 20 === 0) Core.forceSpawnBubble(sim, e.clientX + jitter(20), e.clientY + jitter(20));
        if (pressed && ++dragMoves > 3) isDrag = true;
    });
    canvas.addEventListener('mouseleave', () => { sim.mouse.x = -9999; sim.mouse.y = -9999; pressed = false; });
    canvas.addEventListener('mousedown', () => { pressed = true; isDrag = false; dragMoves = 0; });
    canvas.addEventListener('mouseup', e => {
        if (pressed && !isDrag) {
            if (e.button === 0) {
                Core.forceSpawnWorm(sim, e.clientX, e.clientY);
            } else if (e.button === 2) {
                for (let i = 0; i < 5; i++) Core.forceSpawnBubble(sim, e.clientX + jitter(30), e.clientY + jitter(20));
            }
        }
        pressed = false; isDrag = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
